version: '3.9'

services:
    service:
        container_name: $CONTAINER_NAME
        image: krinkin/$PROJECT.$SERVICE_NAME:$BRANCH

        ports:
            - "5000:5000"
        env_file:
            - ./.env
        volumes:
            - $CONTAINER_DATA:/data
            - $VERSION_FILE:/VERSION:ro


    tunnel:
        container_name:  ${CONTAINER_NAME}_tunnel
        depends_on:
            -   service
        env_file:
            - ./.env
        image: cloudflare/cloudflared:latest
        command: [ "tunnel",
                   "--no-autoupdate",
                   "run",
                   "--token",
                   "$CF_TOKEN"
        ]

