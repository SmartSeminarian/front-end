version: '3.9'

services:
    service:
        container_name: $CONTAINER_NAME
        build:
          context: .
          dockerfile: ./Dockerfile
        ports:
            - "5173:5173"
        env_file:
            - ./.env
        volumes:
            - $CONTAINER_DATA:/data
            - $VERSION_FILE:/VERSION:ro
#UNCOMMENT_ME_FOR_DEV            - ./app:/smart-seminarian-frontend:ro
